name: Threads auto-reply

on:
  schedule:
    # The reply sweep. GitHub runs these on a best-effort basis, so the real
    # gap is sometimes 15 minutes and sometimes a little more. That is fine.
    - cron: "*/15 * * * *"
    # The token refresh. A long-lived token lasts 60 days and one call buys a
    # fresh 60, so monthly is the least that is still safe - if a run fails we
    # still have about a month of runway. 04:00 UTC on the 1st.
    - cron: "0 4 1 * *"
  workflow_dispatch:      # lets Julia run it by hand from the Actions tab

concurrency:
  group: threads-autoreply
  cancel-in-progress: false

jobs:
  reply:
    # Every schedule except the monthly refresh one, plus manual runs.
    if: github.event.schedule != '0 4 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reply to keyword comments
        env:
          # No user id needed - the script asks the token who it belongs to.
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # Set this repository variable to 1 to watch it run without sending.
          THREADS_DRY_RUN: ${{ vars.THREADS_DRY_RUN }}
        run: python autoreply.py

  # Keeps the 60-day token alive. Only fires on the monthly cron above.
  refresh:
    if: github.event.schedule == '0 4 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh the token
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python refresh_token.py
