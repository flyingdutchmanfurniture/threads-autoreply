name: Threads auto-reply

on:
  schedule:
    # The reply sweep. GitHub runs these on a best-effort basis, so the real
    # gap is sometimes 15 minutes and sometimes a little more. That is fine.
    - cron: "*/15 * * * *"
    # The token refresh. A long-lived token lasts 60 days and one call buys a
    # fresh 60. Weekly - which is what refresh_token.py was always documented
    # to do - so it would take eight misses in a row before the token is
    # anywhere near expiry. 04:00 UTC on Sundays.
    - cron: "0 4 * * 0"
  workflow_dispatch: # lets Julia run it by hand from the Actions tab
    inputs:
      refresh_token:
        description: "Refresh the Threads token instead of running a reply sweep"
        type: boolean
        default: false

jobs:
  reply:
    # Every schedule except the token refresh one, plus manual runs that did
    # not ask for a refresh.
    if: github.event.schedule != '0 4 * * 0' && github.event.inputs.refresh_token != 'true'
    runs-on: ubuntu-latest
    # The sweep serialises against itself and against nothing else. This used
    # to sit at workflow level, which meant a 5-hour sweep held the group and
    # the monthly refresh run queued behind it and was cancelled before it ever
    # started - exactly what happened on 1 Nov 2026.
    concurrency:
      group: threads-autoreply-reply
      cancel-in-progress: false
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reply to keyword comments
        env:
          # No user id needed - the script asks the token who it belongs to.
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # Set this repository variable to 1 to watch it run without sending.
          THREADS_DRY_RUN: ${{ vars.THREADS_DRY_RUN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 22); do
            # Pick up anything committed since this run started, so a mapping
            # added to config.json goes live on the next sweep instead of
            # waiting for the next run to check the repository out again.
            git fetch --quiet --unshallow origin main 2>/dev/null || git fetch --quiet origin main
            git reset --hard --quiet FETCH_HEAD || true
            true > $GITHUB_STEP_SUMMARY
            python autoreply.py
            # Publish the waiting list straight away. The run summary only
            # becomes readable once the whole run has finished, hours later,
            # which is far too late for the mapping task.
            # -e is on in Actions, so every line here must be allowed to fail.
            git add waiting.json 2>/dev/null || true
            if [ -f waiting.json ] && ! git diff --cached --quiet -- waiting.json; then
              git commit -q -m "Reels waiting for a mapping [skip ci]" || true
              git push -q origin HEAD:main || true
            fi
            if test $i -lt 22; then sleep 900; fi
          done

  # Keeps the 60-day token alive. Fires on the weekly cron above, or on a
  # manual run with "refresh_token" ticked.
  refresh:
    if: github.event.schedule == '0 4 * * 0' || github.event.inputs.refresh_token == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: threads-autoreply-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # refresh_token.py seals the new token with libsodium before writing it
      # back as a secret. Without this it cannot save anything.
      - name: Install pynacl
        run: pip install pynacl

      # Without GH_PAT the script refreshes the token, throws the new one away
      # and still exits 0 - which is why this job looked green every time while
      # saving nothing at all. Stop before that happens, and stop loudly.
      - name: Check the new token can actually be saved
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT is not set, so a refreshed token cannot be written back into THREADS_ACCESS_TOKEN. Add a fine-grained personal access token with Secrets: write on this repository as the GH_PAT secret."
            exit 1
          fi

      - name: Refresh the token
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python refresh_token.py
